library:
  name: "@rockhall/electron-offline-content"
  version: "0.4.1"
  repository: "https://github.com/rockhallweb/electron-offline-content"
  description: >
    Electron package for kiosk-style apps that syncs a full flat asset store of
    offline media content to disk via SQLite metadata and blob storage, then serves it
    through a privileged media:// protocol and framework-agnostic renderer bridge.
  primary_framework: null

domains:
  - name: "Content sync and storage"
    slug: "content-sync"
    description: >
      Main-process store resolution, download pipeline, generation-based
      snapshot commits, storage root management, and disk-backed blob cache.

  - name: "Renderer access"
    slug: "renderer-access"
    description: >
      Preload IPC bridge, renderer client, query watchers, status subscriptions,
      and media:// protocol for serving cached assets to the renderer process.

  - name: "Configuration and operations"
    slug: "config-ops"
    description: >
      Storage limits, logging, sync failure modes, dev passthrough, storage
      path resolution, and production deployment readiness for kiosk environments.

skills:
  - name: "Getting Started"
    slug: "getting-started"
    domain: "content-sync"
    description: >
      Full integration from zero: install, write resolveStore, configure
      createMediaCache in main, wire preload bridge, create the renderer client,
      and render first content offline.
    type: lifecycle
    covers:
      - "createMediaCache()"
      - "mediaCache.start()"
      - "exposeMediaCacheBridge()"
      - "createMediaCacheRenderer()"
      - "MediaCacheBridge"
      - "resolveStore callback"
      - "createMediaStore / store.defineIndex / store.add"
      - "app.requestSingleInstanceLock()"

  - name: "Store Authoring"
    slug: "store-authoring"
    domain: "content-sync"
    description: >
      Writing resolveStore functions against any remote source (CMS, S3, API),
      using createMediaStore, store.defineIndex, and store.add with a flat
      url string per asset. Secondary indexes for querying, validation rules,
      and version-driven cache busting.
    type: core

  - name: "Cache Configuration"
    slug: "cache-configuration"
    domain: "config-ops"
    description: >
      createMediaCache options, storage path resolution, dev passthrough,
      assetBaseUrl, sync failure mode, storage limits, and logging.
    type: core

  - name: "Authenticated Downloads"
    slug: "authenticated-downloads"
    domain: "content-sync"
    description: >
      Authenticated asset downloads through presigned URLs embedded in the
      manifest asset URL field during resolveStore.
    type: core

  - name: "Production Checklist"
    slug: "production-checklist"
    domain: "config-ops"
    description: >
      Go-live audit for production kiosk deployments.
    type: lifecycle

