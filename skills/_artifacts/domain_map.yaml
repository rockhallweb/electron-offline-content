  - skill: "cache-configuration"
    question: >
      What happens when the manifest grows very large (thousands of items)?
      Pagination defaults to 50 with a hard max of 500.
    context: >
      v1 syncs the entire catalog on every run. Large manifests may cause
      long sync times or memory pressure during manifest resolution.
