gaps:
  - skill: "getting-started"
    question: >
      How should agents handle the kiosk reboot lifecycle? Maintainer
      mentioned nightly reboots to refresh content but no docs explain
      the expected lifecycle.
    context: >
      Kiosk apps may need to handle app.on("second-instance") and graceful
      restart patterns. The example shows single-instance locking but not
      reboot-triggered sync.
    status: open
  - skill: "react-rendering"
    question: >
      How should errors be surfaced in a kiosk with no user interaction
      (no keyboard, no mouse)?
    context: >
      Kiosk UIs typically auto-recover or show minimal error states. The
      hooks provide error aggregation but no guidance on kiosk-specific
      error display patterns.
    status: open
  - skill: "manifest-authoring"
    question: >
      Is there a recommended pattern for S3-compatible bucket integration?
    context: >
      Maintainer confirmed that mapping ListObjects to store shape is
      straightforward. The main pitfall is pre-signed URL expiration duration
      relative to catalog sync time; use generous TTLs and store expiresAt.
    status: resolved-in-failure-modes
  - skill: "cache-configuration"
    question: >
      What happens when the catalog grows very large (thousands of assets)?
      Pagination defaults to 50 with a hard max of 500.
    context: >
      v1 syncs the entire catalog on every run. Large stores may cause
      long sync times or memory pressure during resolveStore.
    status: open
  - skill: "authenticated-downloads"
    question: >
      Should the package accept an optional manifest-level expiration timestamp
      to fail fast when pre-signed URLs are about to expire?
    context: >
      Maintainer identified this as a potential feature (filed in unofficial
      issues #9). Currently, expired pre-signed URLs cause opaque download
      errors mid-sync rather than an early, clear failure.
    status: filed-as-issue
