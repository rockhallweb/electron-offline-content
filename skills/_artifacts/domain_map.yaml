# Status: reviewed

library:
  name: "@rockhallweb/electron-offline-content"
  version: "0.4.0"
  repository: "https://github.com/rockhallweb/electron-offline-content"
  description: >
    Electron package for kiosk-style apps that syncs a full flat asset store of
    offline media content to disk via SQLite metadata and blob storage, then serves it
    through a privileged media:// protocol with React hooks for renderer access.
  primary_framework: "React"

domains:
  - name: "Content sync and storage"
    slug: "content-sync"
    description: >
      Main-process manifest resolution, download pipeline, generation-based
      snapshot commits, storage root management, and disk-backed blob cache.

  - name: "Renderer access"
    slug: "renderer-access"
    description: >
      Preload IPC bridge, React context provider, query hooks, status
      subscriptions, and media:// protocol for serving cached assets to the
      renderer process.

  - name: "Configuration and operations"
    slug: "config-ops"
    description: >
      Storage limits, logging, sync failure modes, dev passthrough, storage
      path resolution, and production deployment readiness for kiosk
      environments.

skills:
  - name: "Getting Started"
    slug: "getting-started"
    domain: "content-sync"
    description: >
      Full integration from zero: install, write resolveStore, configure
      createMediaCache in main, wire preload bridge, add React provider and
      hooks, render first content offline.
    type: lifecycle
    covers:
      - "createMediaCache()"
      - "mediaCache.start()"
      - "exposeMediaCacheBridge()"
      - "MediaCacheProvider"
      - "useMediaAsset() / useMediaByIndex()"
      - "resolveStore callback"
      - "createMediaStore / store.defineIndex / store.add"
      - "app.requestSingleInstanceLock()"
    tasks:
      - "Install package and set up from zero"
      - "Wire main → preload → renderer for offline content"
      - "Given an endpoint and credentials, render content offline"
      - "Run the example apps to understand the integration"
    failure_modes:
      - mistake: "Creating cache after app.whenReady()"
        mechanism: >
          The media: scheme must be registered before Electron's app ready
          event. createMediaCache() calls protocol.registerSchemesAsPrivileged
          in its constructor for offline mode. Constructing after ready causes
          the scheme registration to fail silently or throw.
        wrong_pattern: |
          import { app } from "electron";
          import { createMediaCache } from "@rockhallweb/electron-offline-content/main";

          await app.whenReady();
          const mediaCache = createMediaCache({ /* ... */ });
          await mediaCache.start();
        correct_pattern: |
          import { app } from "electron";
          import { createMediaCache } from "@rockhallweb/electron-offline-content/main";

          const mediaCache = createMediaCache({ /* ... */ });
          await app.whenReady();
          mediaCache.start();
        source: "README quick start; media-cache.ts constructor calls ensureMediaCacheProtocolSchemesPrivileged()"
        priority: CRITICAL
        status: active
      - mistake: "Missing preload bridge setup"
        mechanism: >
          Without exposeMediaCacheBridge() in the preload script, window.mediaCache
          is undefined and all React hooks throw "MediaCache bridge is unavailable".
        wrong_pattern: |
          // preload.ts — missing bridge setup
          import { contextBridge } from "electron";
          // no media cache bridge exposed
        correct_pattern: |
          // preload.ts
          import { exposeMediaCacheBridge } from "@rockhallweb/electron-offline-content/preload";
          exposeMediaCacheBridge();
        source: "react/index.tsx useMediaBridge() throw"
        priority: CRITICAL
        status: active
      - mistake: "Missing MediaCacheProvider in React tree"
        mechanism: >
          All query hooks require a MediaCacheProvider ancestor (or
          window.mediaCache fallback). Without it, useMediaBridge()
          and the query hooks throw. Agents may skip the provider when generating React code.
        wrong_pattern: |
          // renderer.tsx
          import { useMedia } from "@rockhallweb/electron-offline-content/react";
          function App() {
            const items = useMedia({ kind: "list", namespace: "videos", limit: 20 });
            // ...
          }
          createRoot(document.getElementById("root")!).render(<App />);
        correct_pattern: |
          import { MediaCacheProvider, useMedia } from "@rockhallweb/electron-offline-content/react";
          function App() {
            const items = useMedia({ kind: "list", namespace: "videos", limit: 20 });
            // ...
          }
          createRoot(document.getElementById("root")!).render(
            <MediaCacheProvider><App /></MediaCacheProvider>
          );
        source: "react/index.tsx MediaCacheProvider"
        priority: HIGH
        status: active
      - mistake: "Forgetting app.requestSingleInstanceLock()"
        mechanism: >
          Without the instance lock, a second Electron process can launch and
          collide on the same storage root, causing StorageOwnershipError.
          The example apps demonstrate the correct pattern.
        wrong_pattern: |
          // main.ts — no single instance lock
          async function bootstrap() {
            const mediaCache = createMediaCache({ /* ... */ });
            await app.whenReady();
            await mediaCache.start();
          }
        correct_pattern: |
          if (!app.requestSingleInstanceLock()) {
            app.exit(1);
          }
          async function bootstrap() {
            const mediaCache = createMediaCache({ /* ... */ });
            await app.whenReady();
            mediaCache.start();
          }
        source: "README; examples/local/src/main.ts"
        priority: HIGH
        status: active
      - mistake: "Awaiting mediaCache.start() at app launch"
        mechanism: >
          start() begins the async download pipeline but should not be awaited
          at the top level — doing so blocks window creation and other setup
          until the entire sync completes. The UI appears blank until all
          downloads finish. start() is fire-and-forget; the React hooks show
          progress while the sync runs in the background.
        wrong_pattern: |
          await app.whenReady();
          await mediaCache.start();  // blocks everything until sync completes
          createWindow();
        correct_pattern: |
          await app.whenReady();
          createWindow();
          mediaCache.start(); // non-blocking — hooks show progress
        source: "Maintainer interview; media-cache.ts start() returns void promise"
        priority: HIGH
        status: active
      - mistake: "Not realizing start() timing is flexible"
        mechanism: >
          Agents default to calling start() immediately at app launch, but the
          developer controls when syncing begins. start() can be called after
          user confirmation via a renderer button, after other initialization,
          or conditionally based on network status. This flexibility exists
          specifically so developers can control the download lifecycle.
        source: "Maintainer interview"
        priority: MEDIUM
        status: active

  - name: "Manifest Authoring"
    slug: "manifest-authoring"
    domain: "content-sync"
    description: >
      Writing resolveStore functions against any remote source (CMS, S3, API),
      using createMediaStore, store.defineIndex, and store.add with a flat
      url string per asset. Secondary indexes for querying, validation rules,
      and version-driven cache busting.
    type: core
    covers:
      - "resolveStore callback"
      - "createMediaStore() / MediaStore"
      - "store.defineIndex() / IndexTag"
      - "store.add(AssetKeyInput, MediaAssetInput)"
      - "MediaAssetInput (flat url: string — no nested source object)"
      - "FlatManifest / FlatManifestAsset (serialized store shape)"
      - "Secondary indexes (single vs multi cardinality, required)"
      - "AssetKeyInput (string or string[] segments)"
      - "Version-driven cache busting"
    tasks:
      - "Write a resolveStore function for a CMS or API"
      - "Model grouping with index tags instead of namespace hierarchies"
      - "Define multi-asset content (video + poster + subtitles) as separate store.add keys"
      - "Iterate arrays into store.add calls with validation at build time"
      - "Debug StoreValidationError from duplicate keys or invalid fields"
    failure_modes:
      - mistake: "Duplicate asset keys when building the store from arrays"
        mechanism: >
          Each AssetKeyInput must be unique. Calling store.add twice with the
          same key throws StoreValidationError.
        wrong_pattern: |
          for (const row of rows) {
            store.add(["video", row.slug], { version: "1", mimeType: "video/mp4", url: row.url });
            store.add(["video", row.slug], { version: "2", mimeType: "video/mp4", url: row.url2 });
          }
        correct_pattern: |
          store.add(["video", row.slug, "main"], { version: "1", mimeType: "video/mp4", url: row.url });
          store.add(["video", row.slug, "alt"], { version: "2", mimeType: "video/mp4", url: row.url2 });
        source: "store.ts; validation.ts duplicate key check"
        priority: HIGH
        status: active
      - mistake: "Omitting required asset version field"
        mechanism: >
          The version field is required on every asset and drives cache busting.
          Agents may omit it or set it to an empty string, which fails validation
          (min length 1).
        wrong_pattern: |
          store.add(["video", "welcome"], {
            mimeType: "video/mp4",
            url: "https://cdn.example.com/welcome.mp4",
          });
        correct_pattern: |
          store.add(["video", "welcome"], {
            version: "2026-03-10.1",
            mimeType: "video/mp4",
            url: "https://cdn.example.com/welcome.mp4",
          });
        source: "validation.ts flat asset input schema"
        priority: HIGH
        status: active
      - mistake: "Asset URL without filename in path"
        mechanism: >
          When fileName is omitted, the package derives it from the URL path
          basename. URLs ending in "/" or with no path segments cause
          StoreValidationError. Set explicit fileName or ensure the URL
          includes a filename.
        wrong_pattern: |
          store.add(["video", "ceremony"], {
            version: "1",
            mimeType: "video/mp4",
            url: "https://cdn.example.com/api/stream/",
          });
        correct_pattern: |
          store.add(["video", "ceremony"], {
            version: "1",
            mimeType: "video/mp4",
            fileName: "stream.mp4",
            url: "https://cdn.example.com/api/stream/",
          });
        source: "internal/asset-file-name.ts deriveAssetFileName"
        priority: HIGH
        status: active
      - mistake: "Using non-HTTP asset source URLs"
        mechanism: >
          Zod validation enforces http:// or https:// on each asset’s download
          URL. file://, data:, or blob: URLs are rejected when the store is
          built or validated.
        wrong_pattern: |
          url: "file:///local/assets/video.mp4"
        correct_pattern: |
          url: "https://cdn.example.com/video.mp4"
        source: "validation.ts HTTP(S) URL validation for flat asset url"
        priority: MEDIUM
        status: active
      - mistake: "Duplicate segment paths when mapping from arrays"
        mechanism: >
          Asset keys must be unique. When mapping from arrays, reuse the same
          AssetKeyInput only if you intend to overwrite (you cannot — the second
          add throws).
        source: "store.ts duplicate key enforcement"
        priority: MEDIUM
        status: active
      - mistake: "Deep nesting or legacy manifest shapes instead of a flat store"
        mechanism: >
          Prefer createMediaStore with imperative store.add calls. Each asset
          is one object with a flat url string; nesting under namespaces/items
          is replaced by AssetKeyInput segments and optional indexes.
        wrong_pattern: |
          // Legacy mental model — defineManifest / nested source objects are removed in 0.4.0
          defineManifest({ namespaces: { videos: { items: { /* ... */ } } } });
        correct_pattern: |
          const store = createMediaStore();
          const collection = store.defineIndex("collection");
          store.add(["videos", "welcome", "main"], {
            version: "v1",
            mimeType: "video/mp4",
            url: "https://cdn.example.com/welcome.mp4",
            indexes: [collection("videos")],
          });
        source: "README store authoring; CHANGELOG 0.4.0"
        priority: HIGH
        status: active
      - mistake: "Over-namespacing with too many granular namespaces"
        mechanism: >
          Agents may create a separate namespace for every few items when a
          single namespace or a flatter hierarchy would suffice. Namespaces
          add value for organizing sections of an app, not for grouping
          two or three items.
        source: "Maintainer interview"
        priority: MEDIUM
        status: active

  - name: "Cache Configuration"
    slug: "cache-configuration"
    domain: "config-ops"
    description: >
      createMediaCache options and targeted modifications: storage path,
      dev passthrough mode, sync failure modes, storage limits, sync history
      limit, and structured logging.
    type: core
    covers:
      - "MediaCacheOptions interface"
      - "storagePath (appPath + segments)"
      - "devPassthrough mode"
      - "assetBaseUrl origin override"
      - "onSyncFailure modes"
      - "maxCacheBytes / reserveFreeBytes / staleDeleteAfterMs"
      - "syncHistoryLimit"
      - "onLog / logLevel / logFormat"
      - "MediaCacheLogEvent structure"
    tasks:
      - "Change the storage root location"
      - "Enable or disable dev passthrough"
      - "Set disk usage guardrails (maxCacheBytes, reserveFreeBytes)"
      - "Shorten or lengthen the stale delete window"
      - "Add structured logging with a custom sink (pino, logtape)"
      - "Change the sync failure mode"
      - "Change the sync history retention limit"
    failure_modes:
      - mistake: "Setting assetBaseUrl without devPassthrough"
        mechanism: >
          The constructor throws immediately if assetBaseUrl is set while
          devPassthrough is false. Agents may set assetBaseUrl thinking it
          applies to offline mode.
        wrong_pattern: |
          createMediaCache({
            storagePath: { appPath: "temp", segments: ["app"] },
            assetBaseUrl: "http://localhost:3000",
            resolveStore: async () => store,
          });
        correct_pattern: |
          createMediaCache({
            storagePath: { appPath: "temp", segments: ["app"] },
            devPassthrough: true,
            assetBaseUrl: "http://localhost:3000",
            resolveStore: async () => store,
          });
        source: "media-cache.ts constructor; assetBaseUrl validation"
        priority: HIGH
        status: active
      - mistake: "assetBaseUrl with path or query string"
        mechanism: >
          assetBaseUrl must be an origin only (protocol + hostname + port).
          Including a path, query, hash, or credentials causes a throw in
          normalizeAssetBaseUrl.
        wrong_pattern: |
          assetBaseUrl: "http://localhost:3000/api/assets"
        correct_pattern: |
          assetBaseUrl: "http://localhost:3000"
        source: "media-cache.ts normalizeAssetBaseUrl"
        priority: MEDIUM
        status: active
      - mistake: "Using arbitrary file paths for storagePath"
        mechanism: >
          storagePath requires { appPath, segments? } using Electron app.getPath
          names. Agents may pass a raw string path instead.
        wrong_pattern: |
          createMediaCache({
            storagePath: "/tmp/my-cache",
            resolveStore: async () => store,
          });
        correct_pattern: |
          createMediaCache({
            storagePath: { appPath: "temp", segments: ["my-app", "cache"] },
            resolveStore: async () => store,
          });
        source: "types.ts MediaCacheStoragePath; validation.ts mediaCacheStoragePathSchema"
        priority: HIGH
        status: active
      - mistake: "Path separators in storagePath segments"
        mechanism: >
          Storage path segments must not contain "/" or "\". Zod validation
          rejects them. Agents may try to pass "my-app/cache" as a single
          segment instead of using the segments array.
        wrong_pattern: |
          storagePath: { appPath: "temp", segments: ["my-app/offline-media"] }
        correct_pattern: |
          storagePath: { appPath: "temp", segments: ["my-app", "offline-media"] }
        source: "validation.ts storagePathSegmentSchema"
        priority: MEDIUM
        status: active
      - mistake: "Two cache instances targeting same storage root"
        mechanism: >
          MediaCache acquires exclusive ownership of its storage root via a
          lock file. A second instance targeting the same root throws
          StorageOwnershipError.
        source: "storage-root-lock.ts acquireStorageRootLock"
        priority: HIGH
        status: active

  - name: "React Rendering"
    slug: "react-rendering"
    domain: "renderer-access"
    description: >
      MediaCacheProvider, all query hooks, error aggregation with
      useMediaCacheErrors, loading/syncing states, rendering media from
      media:// URLs, and refetch-on-sync behavior.
    type: framework
    covers:
      - "MediaCacheProvider"
      - "useMediaBridge()"
      - "useMediaCacheStatus()"
      - 'useMedia({ kind: "item" | "list", ... })'
      - "useFileStemMatch(stem, options)"
      - "useMediaCacheReady()"
      - "useMediaCacheErrors()"
      - "AsyncState<T> shape"
      - "refetchOnSyncComplete option"
      - "ResolvedMediaContentItem / ResolvedMediaAsset"
      - "assetsByRole convenience lookup"
      - "media:// URL usage in <video>, <img>, <audio>, <track>"
    tasks:
      - "Render content items from hooks in React components"
      - "Add loading state while content downloads"
      - 'Show sync progress or "preparing content" gate'
      - "Display sync and query errors in the UI"
      - "Use assetsByRole for primary video, poster, subtitle"
      - "Browse namespaces with recursive tree queries"
      - "Search by file stem"
      - "Trigger actions when content finishes downloading"
    failure_modes:
      - mistake: "Accessing data properties before loading completes"
        mechanism: >
          All hooks return AsyncState with data: null during initial load.
          Accessing .data.items or .data.phase without null checks causes
          a runtime TypeError.
        wrong_pattern: |
          const items = useMedia({ kind: "list", namespace: "videos", limit: 20 });
          return <div>{items.data.items.map(/* ... */)}</div>;
        correct_pattern: |
          const items = useMedia({ kind: "list", namespace: "videos", limit: 20 });
          if (items.loading) return <p>Loading...</p>;
          return <div>{items.data?.items.map(/* ... */)}</div>;
        source: "react/index.tsx AsyncState type; useState initial null"
        priority: HIGH
        status: active
      - mistake: "Using removed useMediaNamespace / useMediaNamespaceTree"
        mechanism: >
          These hooks were removed in 0.3.0. Use useMedia with kind \"list\"
          and optional recursive: true for namespace trees.
        wrong_pattern: |
          const items = useMediaNamespace("videos", { limit: 20 });
          const tree = useMediaNamespaceTree("courses", { limit: 40 });
        correct_pattern: |
          const items = useMedia({ kind: "list", namespace: "videos", limit: 20 });
          const tree = useMedia({
            kind: "list",
            namespace: "courses",
            recursive: true,
            limit: 40,
          });
        source: "CHANGELOG.md 0.3.0; react/index.tsx useMedia"
        priority: HIGH
        status: active
      - mistake: "Splitting imperative bridge state across multiple hooks"
        mechanism: >
          If a component needs bridge actions plus status and errors together,
          prefer useMediaBridge() over manually combining separate hooks.
          The combined hook keeps imperative bridge UI simpler.
        wrong_pattern: |
          function SyncButton() {
            const status = useMediaCacheStatus();
            const errors = useMediaCacheErrors();
            // some other hook supplies syncNow()
          }
        correct_pattern: |
          function SyncButton() {
            const { syncNow, status, errors } = useMediaBridge();
            return (
              <button onClick={() => void syncNow()}>
                {status.data?.phase ?? errors.primaryError?.message}
              </button>
            );
          }
        source: "react/index.tsx useMediaCacheErrors JSDoc"
        priority: MEDIUM
        status: active
      - mistake: "Hardcoding media:// URLs instead of using hook data"
        mechanism: >
          Asset URLs are media://asset/{namespace}/{itemId}/{assetId} in
          offline mode and remote URLs in dev passthrough. Agents should
          always use item.assets[n].url or item.assetsByRole.primary?.url
          from hook results, never construct URLs manually.
        source: "database.ts buildMediaUrl; README API reference"
        priority: MEDIUM
        status: active
      - mistake: "Fetching remote URLs on the client instead of rendering directly"
        mechanism: >
          Agents may take the URL from a hook result and do a fetch() call
          in the renderer instead of passing the URL directly to src attributes
          on media elements. The whole point of the package is that hook URLs
          are ready-to-render — pass them to <video src>, <img src>, etc.
        wrong_pattern: |
          const item = useMedia({ kind: "item", namespace: "videos", id: "welcome" });
          const [blob, setBlob] = useState(null);
          useEffect(() => {
            if (item.data?.assetsByRole.primary?.url) {
              fetch(item.data.assetsByRole.primary.url)
                .then(r => r.blob())
                .then(setBlob);
            }
          }, [item.data]);
        correct_pattern: |
          const item = useMedia({ kind: "item", namespace: "videos", id: "welcome" });
          if (item.loading) return <p>Loading...</p>;
          return <video src={item.data?.assetsByRole.primary?.url} controls />;
        source: "Maintainer interview"
        priority: HIGH
        status: active

  - name: "Authenticated Downloads"
    slug: "authenticated-downloads"
    domain: "content-sync"
    description: >
      Embedding presigned or otherwise auth-bearing URLs in each asset’s flat
      url field during resolveStore.
    type: core
    covers:
      - "resolveStore callback"
      - "MediaAssetInput.url"
      - "Presigned URL generation at store build time"
      - "store.expiresAt for fail-fast URL expiry"
    tasks:
      - "Generate presigned URLs while building the MediaStore"
      - "Set store expiresAt to the earliest shared URL expiry when using signed URLs"
      - "Verify authenticated downloads with devPassthrough disabled"
    failure_modes:
      - mistake: "Using nested source or non-URL auth instead of a presigned url"
        mechanism: >
          Each asset must use a top-level url string built in resolveStore.
          The old nested source object is removed; authentication belongs in
          the URL (for example a presigned S3 URL).
        wrong_pattern: |
          // Not supported — use flat url (presigned) instead of nested source
          store.add(["video", "welcome"], {
            version: "1",
            mimeType: "video/mp4",
            source: { url: "https://cdn.example.com/video.mp4" },
          });
        correct_pattern: |
          const signedUrl = await getSignedUrl(/* ... */);
          store.add(["video", "welcome"], {
            version: "1",
            mimeType: "video/mp4",
            url: signedUrl,
          });
        source: "README Signed URLs and authentication"
        priority: HIGH
        status: active
        skills: ["authenticated-downloads"]
      - mistake: "Testing auth only in dev passthrough mode"
        mechanism: >
          In dev passthrough, the renderer loads remote URLs directly and the
          main process may never download using the URLs from resolveStore.
          Turn off dev passthrough to validate presigned URLs end-to-end.
        wrong_pattern: |
          createMediaCache({
            storagePath: { appPath: "temp", segments: ["app"] },
            devPassthrough: true,
            resolveStore: async () => buildStoreWithPresignedUrls(),
          });
        correct_pattern: |
          createMediaCache({
            storagePath: { appPath: "temp", segments: ["app"] },
            devPassthrough: false,
            resolveStore: async () => buildStoreWithPresignedUrls(),
          });
        source: "README dev passthrough limitations"
        priority: HIGH
        status: active
        skills: ["authenticated-downloads", "cache-configuration"]
      - mistake: "Pre-signed URL expiration too short for full catalog sync"
        mechanism: >
          When embedding pre-signed URLs in resolveStore, the TTL must exceed
          the total time to download all assets. Assets late in the queue fail
          with opaque HTTP 403 when URLs expire mid-sync. Use a generous TTL
          and set store expiresAt for fail-fast STORE_EXPIRED behavior.
        wrong_pattern: |
          // 15-minute pre-signed URLs for a 500-item catalog that takes 2 hours
          const url = await getSignedUrl(s3Client, getCommand, { expiresIn: 900 });
        correct_pattern: |
          const ttlSeconds = 86400;
          const store = createMediaStore({
            expiresAt: new Date(Date.now() + ttlSeconds * 1000).toISOString(),
          });
          const url = await getSignedUrl(s3Client, getCommand, { expiresIn: ttlSeconds });
        source: "Maintainer interview"
        priority: HIGH
        status: active

  - name: "Production Checklist"
    slug: "production-checklist"
    domain: "config-ops"
    description: >
      Go-live readiness for kiosk deployment: storage limits, structured
      logging, sync failure mode, single instance lock, dev passthrough
      disabled, error handling strategy, and scope boundaries.
    type: lifecycle
    covers:
      - "app.requestSingleInstanceLock()"
      - 'devPassthrough: false (or NODE_ENV !== "development")'
      - "onSyncFailure mode selection"
      - "maxCacheBytes / reserveFreeBytes"
      - "Structured logging with onLog"
      - "Error handling strategy for kiosk displays"
      - "Scope boundaries (read-only presentation assets only)"
    tasks:
      - "Audit configuration before kiosk deployment"
      - "Set storage limits appropriate for the device"
      - "Wire structured logging to a production log sink"
      - "Choose appropriate sync failure mode for the use case"
      - "Verify dev passthrough is disabled in production builds"
    failure_modes:
      - mistake: "devPassthrough left enabled in production"
        mechanism: >
          devPassthrough defaults to true when NODE_ENV === "development".
          In production Electron builds, NODE_ENV may be unset (common with
          Electron Forge), which defaults devPassthrough to false. But if
          NODE_ENV is explicitly "development" in a deployed build, downloads
          are skipped and content loads from remote URLs.
        wrong_pattern: |
          // NODE_ENV=development in a production build
          createMediaCache({
            storagePath: { appPath: "temp", segments: ["app"] },
            resolveStore: async () => store,
          });
        correct_pattern: |
          createMediaCache({
            storagePath: { appPath: "temp", segments: ["app"] },
            devPassthrough: false,
            resolveStore: async () => store,
          });
        source: "media-cache.ts constructor; types.ts MediaCacheOptions.devPassthrough JSDoc"
        priority: CRITICAL
        status: active
        skills: ["production-checklist", "cache-configuration"]
      - mistake: "No storage limits on kiosk with limited disk"
        mechanism: >
          Without maxCacheBytes, the cache can grow to the full manifest size
          subject only to disk space and the default 1 GiB reserveFreeBytes
          headroom. On kiosk hardware with limited SSDs, a large catalog can
          still exhaust the disk and stress the OS; set maxCacheBytes and tune
          reserveFreeBytes explicitly.
        source: "README Storage limits section"
        priority: HIGH
        status: active
      - mistake: "Using default console logging in production"
        mechanism: >
          When onLog is omitted and NODE_ENV is not "production", the package
          prints to console. Production kiosks should use structured logging
          with onLog for log aggregation and alerting.
        source: "media-cache.ts emitLog; README Logging section"
        priority: MEDIUM
        status: active
      - mistake: "Using this package for user-generated content"
        mechanism: >
          The cache is read-only for presentation assets. It does not expose
          write operations to the renderer and should not be used for webcam
          photos, user uploads, or any content generated at runtime.
        source: "Maintainer interview"
        priority: MEDIUM
        status: active
      - mistake: "Shipping with only dev passthrough testing"
        mechanism: >
          devPassthrough bypasses real storage and protocol serving. A dev
          may never test their chosen storagePath or media:// serving until
          production. Platform-specific filesystem permissions, DOM security
          for local protocol URLs, and disk space for full catalog downloads
          only surface in offline mode. Always build and test with
          devPassthrough disabled before deploying.
        source: "Maintainer interview"
        priority: CRITICAL
        status: active
      - mistake: "Switching to offline mode without considering disk space"
        mechanism: >
          When an agent or developer switches from devPassthrough to offline
          mode, the full catalog downloads to the local machine. Large
          catalogs may exceed the developer's available disk space. Before
          disabling passthrough, verify available disk space or scope down
          the manifest to a subset for smoke testing.
        source: "Maintainer interview"
        priority: HIGH
        status: active

tensions:
  - name: "Dev passthrough simplicity vs production correctness"
    skills: ["cache-configuration", "production-checklist"]
    description: >
      devPassthrough makes development fast (no downloads, instant startup)
      but changes behavior: the main process skips real downloads, onSyncFailure
      is overridden to throw, and hook URLs are remote instead of local media://.
    implication: >
      An agent may generate code that works in dev passthrough but breaks
      in production offline mode — especially authenticated downloads and
      sync failure resilience.

  - name: "Store shape flexibility vs validation strictness"
    skills: ["manifest-authoring", "getting-started"]
    description: >
      resolveStore returns a MediaStore you build imperatively, but validation
      is strict on uniqueness constraints, required fields like version, and
      flat http(s) url strings on every asset.
    implication: >
      An agent may forget required fields (version) or produce duplicate keys,
      causing StoreValidationError when building the store or during sync.

  - name: "Sync resilience vs stale content"
    skills: ["cache-configuration", "production-checklist"]
    description: >
      serve-last-snapshot is safe for kiosks (never blank screen) but may
      serve outdated content indefinitely if syncs keep failing. throw is
      honest but can leave the UI in an error state with no content.
    implication: >
      An agent optimizing for reliability will choose serve-last-snapshot
      without considering that silently stale content may be worse than
      a visible error in some kiosk contexts.

  - name: "Presigned URL TTL vs catalog sync duration"
    skills: ["authenticated-downloads", "manifest-authoring"]
    description: >
      Pre-signed URLs embedded in resolveStore are simple but have a TTL
      ceiling: the expiration must cover the entire download queue. There is
      no per-download signing hook—only the flat url string on each asset.
    implication: >
      An agent must size TTLs and store expiresAt for the worst-case sync
      duration, especially for large catalogs.

