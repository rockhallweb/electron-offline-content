name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    if: github.event.release.prerelease == false

    steps:
      - name: Check release tag
        run: |
          if ! [[ "${{ github.event.release.tag_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v0.4.1."
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${{ github.event.release.tag_name }}"
          tag_version="${tag_version#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version ($package_version) does not match release tag ($tag_version)."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm test

      - name: Run validation pipeline
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm validate

      - name: Verify package tarball
        run: pnpm pack:verify

      - name: Install example dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --dir examples/local &
          pid1=$!
          pnpm install --frozen-lockfile --ignore-scripts --dir examples/nasa &
          pid2=$!
          wait $pid1 || exit 1
          wait $pid2 || exit 1

      - name: Verify example apps
        run: pnpm examples:verify

      - name: Pack release artifact
        run: |
          mkdir -p release-artifact
          npm pack --pack-destination release-artifact

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package
          path: release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    name: stage npm package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: validate
    environment: npm
    permissions:
      contents: read
      id-token: write
    if: github.event.release.prerelease == false

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package
          path: release-artifact

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Stage package
        run: npm stage publish release-artifact/*.tgz --access public
