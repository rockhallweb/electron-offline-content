name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (node ${{ matrix.node-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    # Turborepo remote cache (Vercel): add repo secret TURBO_TOKEN and variable TURBO_TEAM (team slug or hobby username).
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_NODE_VERSION: ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 25]
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Turbo validation pipeline
        env:
          # Vitest workers default to ~2GB heaps; jsdom + large main tests can OOM on ubuntu-latest.
          NODE_OPTIONS: --max-old-space-size=6144
        # Smoke tests are headless; xvfb-run here caused long stalls on ubuntu-latest (Vitest + jsdom).
        run: pnpm validate

      - name: Pack verify (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node-version == 24
        run: pnpm pack:verify

      - name: Install example dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --dir examples/local &
          pid1=$!
          pnpm install --frozen-lockfile --ignore-scripts --dir examples/nasa &
          pid2=$!
          wait $pid1 || exit 1
          wait $pid2 || exit 1

      - name: Verify example apps
        run: pnpm examples:verify

  test-integration:
    name: test integration (Vitest node, node ${{ matrix.node-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 25]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run main-process Vitest suite (integration)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: xvfb-run -a pnpm exec vitest run --config vitest.node.config.ts
